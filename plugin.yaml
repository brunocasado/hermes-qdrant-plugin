name: hermes-qdrant-plugin
version: 0.2.0
description: "Semantic index of project files in Qdrant — tools, auto-reindex hooks, statusbar pill."
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/brunocasado/hermes-qdrant-plugin
tags:
  - qdrant
  - semantic-search
  - vector
  - indexing
  - desktop
python_dependencies:
  - "qdrant-client>=1.7,<2"
  - "httpx>=0.27,<1"
  - "filelock>=3.15,<4"
  - "tree-sitter>=0.23,<0.27"
  - "tree-sitter-javascript>=0.23,<0.26"
  - "tree-sitter-typescript>=0.23,<0.24"
  - "tree-sitter-go>=0.23,<0.26"
  - "tree-sitter-rust>=0.23,<0.25"
  - "tree-sitter-java>=0.23,<0.24"
  - "PyYAML>=6,<7"
hooks:
  - post_tool_call
provides_tools:
  - qdrant_index
  - qdrant_search
  - qdrant_status
  - qdrant_list_collections
  - qdrant_delete_collection
  - qdrant_set_server
provides_hooks:
  - post_tool_call
